[project]
name = "variation-normalizer"
version = "0.16.0"
authors = [
    {name = "Alex Wagner"},
    {name = "Kori Kuzma"},
    {name = "James Stevenson"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
description = "VICC normalization routine for variations"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "biocommons.seqrepo",
    "fastapi",
    "uvicorn",
    "pydantic ==2.*",
    "ga4gh.vrs[extras] >=2.3.0,<3.0",
    "gene-normalizer >=0.9.0",
    "boto3",
    "cool-seq-tool ~=0.16.0",
    "bioutils"
]

[project.optional-dependencies]
tests = ["pytest>=6.0", "pytest-cov", "pytest-asyncio", "pyyaml"]
dev = [
    "fastapi[standard]",
    "prek>=0.2.23",
    "ruff==0.14.10",
    "psycopg2-binary",
    "jupyter",
    "ipykernel"
]

[project.urls]
Homepage = "https://github.com/cancervariants/variation-normalization"
Documentation = "https://github.com/cancervariants/variation-normalization"
Changelog = "https://github.com/cancervariants/variation-normalization/releases"
Source = "https://github.com/cancervariants/variation-normalization"
"Bug Tracker" = "https://github.com/cancervariants/variation-normalization/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=src --cov-report term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
src = ["src"]
extend-exclude = [
    "codebuild/*"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # unused
    "AIR",
    "ERA",
    "YTT",
    "BLE",
    "FBT",
    "CPY",
    "DJ",
    "EXE",
    "FIX",
    "FA",
    "PYI",
    "TD",
    "C90",
    "NPY",
    "PD",
    # ignore for compatibility with formatter
    "D206",
    "D300",
    "W191",
    "E111",
    "E114",
    "E117",
    "E501",
    "W191",
    "S321",
    "COM812",
    "COM819",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    # don't require types on *args, **kwargs
    "ANN002",
    "ANN003",
    # subjective pylint thresholds
    "PLR0904",
    "PLR091",
    "PLR1702",
    "PLC0206",
    # misc unnecessary stuff
    "S321",
    "D203",
    "D205",
    "D213",
    "D400",
    "D415",
    # excessive type ignore requirements
    "PGH003",
]

[tool.ruff.lint.per-file-ignores]
# ANN001 - missing-type-function-argument
# ANN2 - missing-return-type
# ANN201 - Missing type annotation
# N805 - invalid-first-argument-name-for-method
# S101 - assert
# B011 - assert-false
# SLF001 - private-member-access
# INP001 - implicit-namespace-package
# RUF001 - ambiguous-unicode-character-string
# ARG002 - unused-method-argument
# PLR2004 - magic-value-comparison
"tests/*" = [
    "ANN001",
    "ANN2",
    "D",
    "S101",
    "B011",
    "SLF001",
    "INP001",
    "PLR2004",
]
"codebuild/*" = ["T201", "INP001"]
"src/variation/validators/*" = ["ARG002"]
"src/variation/translators/*" = ["ARG002"]
"src/variation/classifiers/*" = ["PLR2004"]

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.format]
docstring-code-format = true
