name: Publish docs

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra docs
          # Zensical requires its mike fork, which is not published on PyPI.
          uv pip install git+https://github.com/squidfunk/mike.git

      - name: Verify documentation build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync zensical build --clean --strict
          test -f site/index.html

      - name: Publish versioned documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REF_TYPE: ${{ github.ref_type }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$GIT_REF_TYPE" == "branch" ]]; then
            uv run --no-sync mike deploy --push latest
            uv run --no-sync mike set-default --push latest
          else
            uv run --no-sync mike deploy --push "$GIT_REF_NAME"
          fi

      - name: Prepare versioned Pages site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          git archive refs/heads/gh-pages | tar -x -C "$RUNNER_TEMP/pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  publish-pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
